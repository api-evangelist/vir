aid: vir
name: Vir
description: 'Vir Biotechnology, Inc. (NASDAQ: VIR) is a clinical-stage immunology company
  headquartered in San Francisco that combines immunologic insights with modern technology
  platforms to treat and prevent serious infectious diseases and, increasingly, cancer.
  Its pipeline spans chronic hepatitis B and D, respiratory infections, and dual-masked
  T-cell engagers for solid tumors, built on antibody, T-cell, innate-immunity, and
  small interfering RNA (siRNA) platforms. Vir is a research and corporate organization
  surfaced as a portfolio company of SoftBank Vision Fund; as of this enrichment pass it
  publishes no public developer API, SDK, MCP server, or developer portal — only its
  corporate and investor websites.'
